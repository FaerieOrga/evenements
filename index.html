<!DOCTYPE html>
<html lang="fr">
<head>
<script>
// ── Mesure d'audience (Google Analytics) : chargée seulement après accord ──
(function () {
  var CLE = 'faerie_cookies_analytics';
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { dataLayer.push(arguments); };

  function lireChoix() {
    try {
      var brut = localStorage.getItem(CLE);
      if (!brut) return null;
      var p = brut.split('|');
      if (Date.now() - Number(p[1]) > 180 * 24 * 3600 * 1000) return null;
      return p[0];
    } catch (e) { return null; }
  }
  function ecrireChoix(v) {
    try { localStorage.setItem(CLE, v + '|' + Date.now()); } catch (e) {}
  }

  function chargerAnalytics() {
    if (window.__analyticsCharge) return;
    window.__analyticsCharge = true;
    gtag('js', new Date());
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-MN49RWMP';
    document.head.appendChild(s);
  }

  function supprimerCookiesGoogle() {
    document.cookie.split(';').forEach(function (c) {
      var nom = c.split('=')[0].trim();
      if (nom === '_ga' || nom === '_gid' || nom.indexOf('_ga_') === 0) {
        var vieux = '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
        document.cookie = nom + vieux;
        document.cookie = nom + vieux + '; domain=' + location.hostname;
      }
    });
  }

  function choisir(valeur) {
    var dejaCharge = window.__analyticsCharge;
    ecrireChoix(valeur);
    var b = document.getElementById('bandeau-cookies');
    if (b) b.remove();
    if (valeur === 'oui') {
      chargerAnalytics();
    } else {
      supprimerCookiesGoogle();
      if (dejaCharge) location.reload();
    }
  }

  function afficherBandeau() {
    if (document.getElementById('bandeau-cookies')) return;
    var style = 'padding:10px 22px;background:#fff;color:#1e293b;border:1px solid #58abbc;border-radius:4px;' +
                'font-family:Cinzel,serif;font-size:0.8rem;letter-spacing:1px;cursor:pointer;font-weight:600';
    var b = document.createElement('div');
    b.id = 'bandeau-cookies';
    b.setAttribute('role', 'dialog');
    b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:400;max-width:560px;margin:0 auto;' +
      'background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:16px 18px;' +
      "box-shadow:0 10px 40px rgba(0,0,0,0.3);font-family:'Crimson Text',Georgia,serif;color:#1e293b;" +
      'font-size:0.95rem;line-height:1.5';
    b.innerHTML =
      '<div style="margin-bottom:12px">Pour savoir si cette page est utile, nous mesurons sa fréquentation avec ' +
      'Google Analytics (cookies). Acceptez-vous ? Vous pouvez changer d\'avis à tout moment via « Gérer les cookies », en bas de page.</div>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
      '<button id="cookies-oui" style="' + style + '">Accepter</button>' +
      '<button id="cookies-non" style="' + style + '">Refuser</button></div>';
    document.body.appendChild(b);
    document.getElementById('cookies-oui').onclick = function () { choisir('oui'); };
    document.getElementById('cookies-non').onclick = function () { choisir('non'); };
  }

  document.addEventListener('DOMContentLoaded', function () {
    var pied = document.querySelector('.site-footer');
    if (pied) {
      // 1. Bouton Cookies
      var lien = document.createElement('button');
      lien.className = 'footer-orga-link';
      lien.textContent = '🍪 Gérer les cookies';
      lien.onclick = afficherBandeau;
      pied.appendChild(lien);

      // 2. Séparateur 1
      var sep1 = document.createElement('span');
      sep1.className = 'footer-orga-link';
      sep1.style.margin = '0 6px';
      sep1.textContent = '·';
      pied.appendChild(sep1);

      // 3. Lien Politique de confidentialité
      var lienConf = document.createElement('a');
      lienConf.className = 'footer-orga-link';
      lienConf.href = 'https://www.xn--farie-csa.fr/politique-de-confidentialit%C3%A9';
      lienConf.textContent = 'Confidentialité';
      lienConf.style.textDecoration = 'none';
      pied.appendChild(lienConf);

      // 4. Séparateur 2
      var sep2 = document.createElement('span');
      sep2.className = 'footer-orga-link';
      sep2.style.margin = '0 6px';
      sep2.textContent = '·';
      pied.appendChild(sep2);

      // 5. Lien Mentions Légales
      var lienMentions = document.createElement('a');
      lienMentions.className = 'footer-orga-link';
      lienMentions.href = 'https://www.xn--farie-csa.fr/mentions-legales'; // ← Modifiez l'URL si besoin
      lienMentions.textContent = 'Mentions légales';
      lienMentions.style.textDecoration = 'none';
      pied.appendChild(lienMentions);
    }

    var choix = lireChoix();
    if (choix === 'oui') chargerAnalytics();
    else if (choix !== 'non') afficherBandeau();
  });
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Événements</title>
  <link rel="icon" href="https://raw.githubusercontent.com/FaerieOrga/images-forum/main/logo32%20copie.jpg" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=IM+Fell+English:ital@0;1&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --parchment:    #ffffff;
  --parchment-dk: #f8fafc;
  --ink:          #1e293b;
  --ink-light:    #64748b;
  --red-blood:    #b91c1c;
  --gold:         #8c7b50;
  --gold-light:   #cbd5e1;
  --border:       #e2e8f0;
  --shadow:       rgba(15, 23, 42, 0.08);
  --bg-img:       url('https://drive.google.com/uc?export=view&id=142vQlX6NsPL118l3x-VHn9iNx94Vydng');
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: linear-gradient(to bottom,  
    #58abbc 0%,    
    #66b5c6 50%,   
    #e8f4f7 100%   
  ) fixed;
  font-family: 'Crimson Text', Georgia, serif;
  color: var(--ink);
  font-size: 16px;
  line-height: 1.6;
  overflow-y: visible; /* Évite la double barre de scroll */
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.15) 100%);
  pointer-events: none;
  z-index: 0;
}
#app {
  position: relative;
  z-index: 1;
  max-width: 1300px;
  width: 100%;
  margin: 0 auto;
  padding: 20px 16px 60px;
}
.parchment {
  background: var(--parchment);
  border: 1px solid rgba(255,255,255,0.8);
  border-radius: 8px;
  padding: 36px 40px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.2), 0 0 0 1px rgba(0,0,0,0.03);
  position: relative;
  overflow: hidden;
  height: auto;
}
.parchment::before, .parchment::after {
  content: '✦';
  position: absolute;
  font-size: 24px;
  color: #cbd5e1;
  opacity: 0.5;
  line-height: 1;
}
.parchment::before { top: 12px; left: 16px; }
.parchment::after  { bottom: 12px; right: 16px; }

/* ── EN-TÊTE ── */
.site-header { text-align: center; padding: 32px 0 24px; }
.site-title {
  font-family: 'Cinzel', serif;
  font-size: 2.6rem;
  font-weight: 700;
  color: #ffffff;
  text-shadow: 0 2px 12px rgba(0,0,0,0.6), 0 0 20px rgba(255,255,255,0.2);
  letter-spacing: 3px;
  margin-bottom: 6px;
}
.site-subtitle {
  font-family: 'IM Fell English', serif;
  font-style: italic;
  color: #bae6fd;
  font-size: 1.15rem;
  text-shadow: 0 1px 4px rgba(0,0,0,0.5);
}

/* ── FORMS ── */
.form-group { margin-bottom: 16px; text-align: left; }
label {
  display: block;
  font-family: 'Cinzel', serif;
  font-size: 0.78rem;
  letter-spacing: 1.5px;
  color: var(--ink-light);
  margin-bottom: 5px;
  text-transform: uppercase;
}
input[type="text"], input[type="email"], input[type="password"],
input[type="date"], input[type="datetime-local"], input[type="number"], select, textarea {
  width: 100%;
  background: #f8fafc;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 9px 12px;
  font-family: 'Crimson Text', serif;
  font-size: 1rem;
  color: var(--ink);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
input:focus, select:focus, textarea:focus {
  border-color: #64748b;
  box-shadow: 0 0 0 2px rgba(100,116,139,0.15);
}
textarea { min-height: 100px; resize: vertical; line-height: 1.7; }

/* ── BOUTONS ── */
.btn {
  display: inline-block;
  padding: 8px 16px;    
  background: #58abbc;
  color: #ffffff;
  border: none;
  border-radius: 4px;
  font-family: 'Cinzel', serif;
  font-size: 0.65rem;  
  letter-spacing: 1.5px; 
  cursor: pointer;
  text-transform: uppercase;
  transition: all 0.3s ease;
  box-shadow: 0 2px 6px rgba(88, 171, 188, 0.2);
}
.btn:hover {
  background: #468e9d; 
  box-shadow: 0 4px 12px rgba(88, 171, 188, 0.4);
  transform: translateY(-1px);
}
.btn-ghost {
  display: inline-flex;     
  align-items: center;      
  background: transparent;
  border: 1px solid #cbd5e1;
  color: var(--ink-light);
  padding: 9px 16px;        
  font-family: 'Cinzel', serif;
  font-size: 0.75rem;        
  letter-spacing: 1.5px;
  cursor: pointer;
  border-radius: 4px;
  transition: all 0.3s ease;
  text-transform: uppercase;
  height: 40px;             
  box-sizing: border-box;   
}
.btn-ghost:hover { 
  background: #f1f5f9; 
  color: var(--ink); 
  border-color: #94a3b8;
}

/* ── LAYOUT ACCUEIL ── */
.home-layout {
  display: grid;
  grid-template-columns: 1fr 1fr; 
  gap: 24px;
  align-items: start;
  width: 100%;
}
.home-layout > data { min-width: 0; }
@media (max-width: 900px) {
  .home-layout { grid-template-columns: 1fr; } 
}

/* ── PIED DE PAGE ── */
.site-footer { text-align: center; margin-top: 36px; padding-bottom: 10px; }
.footer-orga-link {
  font-family: 'Cinzel', serif;
  font-size: 0.7rem;
  letter-spacing: 1px;
  color: rgba(255,255,255,0.7);
  cursor: pointer;
  border: none;
  background: none;
  transition: color 0.2s;
}
.footer-orga-link:hover { color: #ffffff; }

html { background-color: #e8f4f7; }
</style>
</head>
<body>
<div id="app">

  <div id="public-screen">
    <div class="site-header">
      <div class="site-title">⚔ Événements ⚔</div>
      <div class="site-subtitle">Les prochaines aventures vous attendent</div>
    </div>
    
    <div class="parchment">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px">
        <div style="font-family:'Cinzel',serif;font-size:1.15rem;font-weight:700;letter-spacing:2px;color:var(--ink)">Événements à venir</div>
        <div id="header-user-zone"></div>
      </div>
    </div>

    <!-- Le pied de page alimenté automatiquement par le script avec les cookies, la politique et les mentions -->
    <div class="site-footer"></div>
  </div>

</div>
</body>
</html>
